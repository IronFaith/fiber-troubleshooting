<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b59">
  <meta name="description" content="Loop the optic, choose the result, and follow a simple fiber troubleshooting diagram.">
  <title>Optic / fiber health</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=8">
  <script type="module" src="./app.mjs?v=8"></script>
</head>
<body>
  <main>
    <header><img src="./icon.svg" width="30" height="30" alt=""><div><h1>Optic / fiber health</h1><p>Loop the optic. Follow the result.</p></div></header>
    <fieldset class="loop-choice"><legend>Starting loop location</legend><div>
      <button type="button" data-mode="direct" aria-pressed="true">LC at the optic</button>
      <button type="button" data-mode="passive" aria-pressed="false">MMC at the passive</button>
    </div></fieldset>
    <nav class="toolbar" aria-label="Troubleshooting controls"><span id="step-label">Step 1</span><div><button id="back" type="button" disabled>← Back</button><button id="restart" type="button" disabled>Restart</button></div></nav>
    <div id="diagram" aria-label="Your troubleshooting path"></div>
    <p id="status" class="sr-only" role="status"></p>
    <noscript>Enable JavaScript to use this diagram.</noscript>
    <p class="safety">Never look into a fiber. Use site-approved tests. Answer only after a valid test.</p>
  </main>
</body>
</html>
