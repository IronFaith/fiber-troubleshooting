name: Temporary hardware loop visual verification
on:
  push:
    branches: [codex/hardware-loop-path]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node .github/loop-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-visual-verification
          path: loop-qa-output/
